[general]
import = ["~/.config/alacritty/themes/themes/catppuccin_mocha.toml"]

[font]
size = 11

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.italic]
family = "Hack Nerd Font"
style = "Italic"

[env]
TERM = "xterm-256color"

[window]
padding.x = 10
padding.y = 10

decorations = "Buttonless"

[terminal.shell]
program = "/bin/bash"
args = ["-l", "-c", "~/.tmux/sessions.sh"]
